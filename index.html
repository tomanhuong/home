<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131230">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bảng nhịp">
<title>Bảng nhịp vận hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131230'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FFD400'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
/* ==== MÀU VÀ CHỮ (theo app Cầu nguyện) ==== */
:root {
  --nen1: #1C1A4A; --nen2: #2B296D; --nen3: #131230; --tam: #1f1d52;
  --chu: #EDEFFB; --mo: rgba(237, 239, 251, .62); --rat-mo: rgba(237, 239, 251, .38);
  --vien: rgba(237, 239, 251, .13); --the: rgba(255, 255, 255, .045);
  --vang: #FFD400; --vang-chu: #241D00; --vang-nhat: #F5DE7A;
  --ngoc: #00A79D; --ho: #FDB913; --do: #f85149;
  --serif: 'Crimson Text', Georgia, 'Times New Roman', serif;
  --mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--nen3); }
body {
  margin: 0; min-height: 100vh; color: var(--chu); font-family: var(--serif); font-size: 18px; line-height: 1.45;
  background: linear-gradient(165deg, var(--nen1) 0%, var(--nen2) 45%, var(--nen3) 100%) fixed;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--vang-nhat); }
.mono { font-family: var(--mono); }
.nho { font-size: 12px; } .mo { color: var(--mo); } .ho-phach { color: var(--ho); } .ngoc { color: var(--ngoc); } .do { color: var(--do); }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; }

/* ---- dải sứ mệnh ---- */
#dau { position: sticky; top: 0; z-index: 20; padding: calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background: #17153f; border-bottom: 1px solid var(--vien); }
.dai { display: flex; align-items: center; gap: 8px; }
.dai-chu { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; padding: 6px 10px;
  border: 1px solid rgba(255, 212, 0, .28); border-radius: 10px; }
.dai-1 { color: var(--vang-nhat); font-style: italic; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dai-1 .mui { float: right; font-style: normal; font-size: 13px; opacity: .8; }
.dai-2 { color: var(--vang-nhat); opacity: .78; font-style: italic; font-size: 14px; }
.nut-menu { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--vien); font-size: 22px; line-height: 1; color: var(--chu); flex: none; }
.thanh-mang { margin-top: 6px; font: 11px var(--mono); color: var(--ho); text-align: center; }

/* ---- nội dung ---- */
#noi { padding: 14px 14px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mo); margin: 18px 0 4px; }
.hang { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hang > * { min-width: 0; }
.tx { font-style: italic; color: var(--vang-nhat); opacity: .9; font-size: 16px; margin: 6px 0 0; }
.thanh { height: 6px; border-radius: 3px; background: rgba(237, 239, 251, .12); margin: 12px 0 14px; overflow: hidden; }
.thanh > i { display: block; height: 100%; background: var(--ngoc); border-radius: 3px; transition: width .3s; }
.chuoi { font: 12px var(--mono); color: var(--ngoc); white-space: nowrap; }

.nut-chinh { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 50px;
  padding: 12px 16px; border-radius: 10px; background: var(--vang); color: var(--vang-chu); font: 700 14px var(--mono); text-align: left; }
.nut-chinh span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nut-chinh.xong { background: rgba(0, 167, 157, .16); color: var(--ngoc); border: 1px solid rgba(0, 167, 157, .5); cursor: default; justify-content: center; }
.nut-chinh:disabled { opacity: .6; }
.nut-phu { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 14px;
  border-radius: 10px; border: 1px solid var(--vien); font: 13px var(--mono); color: var(--chu); }
.nut-phu.rong { width: 100%; }
.nut-chu { font: 13px var(--mono); color: var(--vang-nhat); padding: 10px 4px; min-height: 40px; }
.nut-do { font: 13px var(--mono); color: var(--do); padding: 10px 4px; min-height: 40px; }
.chip-nhe { font: 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(253, 185, 19, .6); color: var(--ho); white-space: nowrap; min-height: 34px; }
.chip-nhe.bat { background: rgba(253, 185, 19, .18); }

/* ---- dòng việc ---- */
.viec { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--vien); cursor: pointer; min-height: 52px; }
.viec .ten { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viec .phut, .viec .nhan { font: 12px var(--mono); color: var(--mo); white-space: nowrap; }
.viec .nhan.ho-phach { color: var(--ho); }
.viec.xong .ten { opacity: .5; font-style: italic; text-decoration: line-through; text-decoration-color: rgba(237, 239, 251, .55); }
.viec.xong .phut, .viec.xong .nhan { opacity: .5; }
.viec.con { padding-left: 30px; }
.viec .mui-ra { font: 13px var(--mono); color: var(--rat-mo); }
.tron { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 1.6px solid rgba(237, 239, 251, .55);
  display: flex; align-items: center; justify-content: center; font: 700 14px var(--mono); color: #04342C; }
.tron.da { background: var(--ngoc); border-color: var(--ngoc); }
.tron.nua { border-color: var(--ho); background: rgba(253, 185, 19, .18); }
.tron.khoa { cursor: default; opacity: .8; }
.sao { color: var(--vang-nhat); font-size: 13px; margin-left: 4px; }
.trong { padding: 22px 6px; color: var(--mo); text-align: center; font-style: italic; }

.the { background: var(--the); border: 1px solid var(--vien); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.the p { margin: 0 0 8px; }
.nhom-ky { margin-top: 16px; }
.dau-ky { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--vien); }
.dau-ky .ten-ky { flex: 1; min-width: 0; font: 700 12px var(--mono); letter-spacing: .06em; color: var(--mo); text-transform: uppercase; }
.dau-ky .dem { font: 12px var(--mono); color: var(--mo); }
.nut-ky { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--vien); font: 16px var(--mono); }

/* ---- ghi nhận ---- */
.doan { display: flex; gap: 6px; margin: 10px 0 6px; }
.doan button { flex: 1; min-height: 38px; border-radius: 999px; border: 1px solid var(--vien); font: 12px var(--mono); color: var(--mo); }
.doan button.chon { border-color: var(--vang); color: var(--vang); background: rgba(255, 212, 0, .1); }
.tang { border: 1px solid var(--vien); border-radius: 10px; padding: 12px 14px; background: var(--the); cursor: pointer; }
.tang .dau-tang { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tang .so-tang { font: 700 12px var(--mono); letter-spacing: .08em; color: var(--mo); }
.tang .pt { font: 700 20px var(--mono); }
.tang .vach { height: 8px; border-radius: 4px; background: rgba(237, 239, 251, .1); margin-top: 8px; overflow: hidden; }
.tang .vach i { display: block; height: 100%; background: var(--ngoc); }
.tang .vach i.thap { background: var(--ho); }
.mui-len { text-align: center; color: var(--rat-mo); font-size: 14px; line-height: 1; padding: 4px 0; }
.ct-tang { margin-top: 8px; font-size: 16px; }
.ct-tang .hang { padding: 4px 0; border-top: 1px dashed var(--vien); }
.chi-so { font-size: 15px; margin-top: 6px; }

/* ---- thanh đáy ---- */
#day { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #0f0e28; border-top: 1px solid var(--vien);
  padding-bottom: env(safe-area-inset-bottom); }
#day .trong-day { max-width: 520px; margin: 0 auto; display: flex; }
#day button { flex: 1; min-height: 62px; font: 12px var(--mono); color: var(--mo); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
#day button .bieu { font-size: 18px; line-height: 1; }
#day button.giua { font-weight: 700; }
#day button.chon { color: var(--vang); }

/* ---- tấm trượt ---- */
#lop .nen-lop { position: fixed; inset: 0; z-index: 50; background: rgba(5, 5, 20, .62); display: flex; align-items: flex-end; justify-content: center; }
#lop .tam { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; background: var(--tam);
  border-radius: 16px 16px 0 0; border: 1px solid var(--vien); border-bottom: 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); animation: len .18s ease-out; }
@keyframes len { from { transform: translateY(24px); } to { transform: none; } }
#lop .dau-tam { position: sticky; top: 0; background: var(--tam); display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; z-index: 2; border-bottom: 1px solid var(--vien); margin-bottom: 8px; }
#lop .dau-tam h3 { flex: 1; min-width: 0; margin: 0; font: 700 14px var(--mono); letter-spacing: .04em; }
.nut-dong { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--vien); font: 16px var(--mono); flex: none; }
.dong-menu { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; border-bottom: 1px solid var(--vien); text-align: left; font-size: 18px; min-height: 52px; }
.dong-menu .mono { margin-left: auto; }
.hinh-full { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.hinh-full img { max-width: 100%; max-height: 100%; object-fit: contain; }
.hinh-full .goi-y { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font: 12px var(--mono); color: var(--mo); }

/* ---- biểu mẫu ---- */
label.nhan-o { display: block; font: 12px var(--mono); color: var(--mo); margin: 14px 0 6px; }
input[type=text], input[type=password], input[type=number], input[type=url], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--vien);
  background: rgba(255, 255, 255, .06); font-size: 16px; font-family: var(--serif); outline: none; }
select { font-family: var(--mono); font-size: 14px; }
select option { background: var(--tam); color: var(--chu); }
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: rgba(255, 212, 0, .6); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 38px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--vien); font: 13px var(--mono); color: var(--mo); }
.chip.chon { border-color: var(--vang); color: var(--vang); background: rgba(255, 212, 0, .12); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.loi { color: var(--do); font: 13px var(--mono); margin: 6px 0 0; }
.goi-y-o { color: var(--mo); font: 12px var(--mono); margin: 6px 0 0; }
details.them-ct { margin-top: 14px; border-top: 1px solid var(--vien); }
details.them-ct summary { padding: 12px 0; font: 13px var(--mono); color: var(--vang-nhat); cursor: pointer; list-style: none; }
details.them-ct summary::-webkit-details-marker { display: none; }
.cot2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.cuoi-tam { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.cuoi-tam .hang { justify-content: space-between; }
.dong-cd { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--vien); }
.dong-cd .ten { flex: 1; min-width: 0; cursor: pointer; overflow-wrap: anywhere; }
.dong-cd .meta { display: block; font: 11px var(--mono); color: var(--mo); margin-top: 2px; }
.dong-cd.con { padding-left: 22px; }
.nut-mui { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--vien); font: 13px var(--mono); flex: none; }
.nut-mui:disabled { opacity: .25; }
.luoi-app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.o-app { min-height: 64px; border-radius: 10px; border: 1px solid var(--vien); background: var(--the); padding: 10px 12px; text-align: left; font-size: 16px; overflow-wrap: anywhere; }
.o-app small { display: block; font: 11px var(--mono); color: var(--mo); margin-top: 4px; }
.lich-su { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lich-su span { font: 11px var(--mono); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--vien); color: var(--mo); }
.lich-su span.da { border-color: rgba(0, 167, 157, .6); color: var(--ngoc); }
.cong-tac { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; background: rgba(237, 239, 251, .18); }
.cong-tac::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--chu); transition: transform .15s; }
.cong-tac.bat { background: var(--ngoc); }
.cong-tac.bat::after { transform: translateX(18px); }

/* ---- thông báo ---- */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 70;
  max-width: calc(100% - 24px); width: 480px; display: none; }
#toast.hien { display: flex; }
#toast .hop { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #0d0c26; border: 1px solid var(--vien);
  font: 13px var(--mono); box-shadow: 0 6px 24px rgba(0, 0, 0, .4); }
#toast .hop span { flex: 1; min-width: 0; }
#toast .hop button { color: var(--vang); font: 700 13px var(--mono); padding: 6px 4px; }
#hoi { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 65; width: 480px; max-width: calc(100% - 24px); display: none; }
#hoi.hien { display: block; }
#hoi .hop { padding: 14px; border-radius: 12px; background: #24215c; border: 1px solid rgba(255, 212, 0, .35); box-shadow: 0 6px 24px rgba(0, 0, 0, .45); }
#hoi .hop p { margin: 0 0 10px; }
#hoi .hang button { flex: 1; }

/* ---- màn vào app ---- */
.trung { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 18px; max-width: 460px; margin: 0 auto; }
.trung .tieu { color: var(--vang-nhat); font-style: italic; font-size: 20px; margin: 0 0 4px; }
.trung h1 { margin-bottom: 6px; }
.meta { color: var(--mo); font: 13px var(--mono); }
.bang-kt { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
.bang-kt td { border-bottom: 1px solid var(--vien); padding: 6px 4px; vertical-align: top; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { #lop .tam { animation: none; } }

</style>
</head>
<body>
<div id="app"><div class="trung"><p class="meta">Đang mở…</p></div></div>

      if (r.error === 'unauthorized') { S.dangGui = false; dangXuat('Mật khẩu đã thay đổi — cần mở khoá lại.'); return; }
      var ok = r.ok && (!r.ketQua || !r.ketQua.some || r.ketQua.every(function (x) { return x.ok; }));
      xongLenh(!ok);
    }).catch(function () {
      if (lan < cho.length) setTimeout(thu, cho[lan++]);

    });
  })();
}
function taiLai() {
  if (!S.api || !S.pw) return Promise.resolve();

  if (S.mang !== 'luu') { S.mang = 'dang'; veDau(); }
  return goi('load', { appUrl: location.origin + location.pathname }).then(function (r) {
    if (!r.ok) {
      if (r.error === 'unauthorized') { dangXuat('Mật khẩu đã thay đổi — cần mở khoá lại.'); return; }
      throw new Error(r.error || 'loi');
    }

}

/* ---------- 4. THÔNG BÁO NGẮN ---------- */

/* ---------- 6. S2 HÔM NAY ---------- */

  else if (cl.tong) h += '<div class="nut-chinh xong">Xong việc hôm nay ✓</div>';
  if (!lsGet(LS.anLanDau, false) && bang('E1').length) {

  }

/* ---------- 7. S3 NHỊP ĐIỆU ---------- */
function nhanKy(nhip, s, hienTai) {

  if (nhip === 'thang') return 'Tháng ' + (+s.slice(5, 7)) + (s.slice(0, 4) !== hn.slice(0, 4) ? '/' + s.slice(0, 4) : '') + con;
  return 'Quý ' + LA_MA[+M2.khoaKy('quy', s).slice(6)] + (s.slice(0, 4) !== hn.slice(0, 4) ? '/' + s.slice(0, 4) : '') + con;
}

}

/* ---------- 9. TẤM TRƯỢT (lớp phủ) ---------- */

    (loi ? '<p class="loi">' + esc(loi) + '</p>' : '') + '<button class="nut-chinh" id="nut-api" style="margin-top:12px;justify-content:center">KẾT NỐI</button>' +
    (S.api ? '<button class="nut-chu" id="nut-quay-lai" style="margin-top:6px">‹ Giữ máy chủ đang dùng</button>' : ''));
  if ($('#nut-quay-lai')) $('#nut-quay-lai').onclick = function () { batDauApp(); };
  $('#nut-api').onclick = function () {
    var url = layLinkExec($('#o-api').value), nut = this;
    if (!url) { veKetNoi('Chưa thấy đường dẫn kết thúc bằng /exec.'); return; }
    nut.disabled = true; nut.textContent = 'Đang kiểm tra…';
    kiemMayChu(url).then(function (r) {
      if (!r || !r.ok || r.app !== 'bang-nhip') return veKetNoi('Link này không phải máy chủ Bảng nhịp.');
      if (url !== S.api) datMayChu(url);
      if (r.daCaiDat === false) veCaiDatDau(); else veMatKhau();
    }).catch(function () { veKetNoi('Chưa kết nối được. Kiểm tra link kết thúc bằng /exec và quyền truy cập "Bất kỳ ai".'); });
  };
}
var DONG_MAY_KHAC = '<button class="nut-chu" id="nut-may-khac" style="margin-top:10px">Dùng máy chủ khác</button>';
function ganMayKhac() { var b = $('#nut-may-khac'); if (b) b.onclick = function () { veKetNoi(); }; }
function veCaiDatDau(loi) {
  manTrung('<p class="tieu">✦ Để vinh danh Chúa hơn</p><h1>Cài đặt lần đầu</h1><p class="meta">Máy chủ này chưa có dữ liệu. Đặt mật khẩu để bắt đầu.</p>' +
    '<input id="mk1" type="password" autocomplete="new-password" placeholder="Mật khẩu (ít nhất 6 ký tự)" style="margin-top:14px"><input id="mk2" type="password" autocomplete="new-password" placeholder="Nhập lại" style="margin-top:8px">' +
    '<label class="meta" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="hien-mk"> Hiện mật khẩu</label>' +
    '<label class="meta" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="co-mau" checked style="margin-top:3px"> Tạo sẵn bộ việc mẫu (15 việc, 9 ứng dụng của Nhưỡng). Bỏ chọn nếu cài cho người khác: bắt đầu trống.</label>' +
    (loi ? '<p class="loi">' + esc(loi) + '</p>' : '') + '<button class="nut-chinh" id="nut-cd" style="margin-top:12px;justify-content:center">TẠO BẢNG NHỊP</button>' + DONG_MAY_KHAC);
  ganMayKhac();
  $('#hien-mk').onchange = function () { $('#mk1').type = $('#mk2').type = this.checked ? 'text' : 'password'; };
  $('#nut-cd').onclick = function () {
    var a = nz($('#mk1').value), b = nz($('#mk2').value);
    if (a.length < 6) return veCaiDatDau('Mật khẩu ít nhất 6 ký tự.');
    if (a !== b) return veCaiDatDau('Hai lần nhập chưa khớp.');
    this.disabled = true; this.textContent = 'Đang tạo…';
    goi('cai_dat', { matKhau: a, mau: $('#co-mau').checked }).then(function (r) {
      if (!r.ok && r.error !== 'da_cai_roi') return veCaiDatDau('Chưa tạo được (' + r.error + '). Thử lại.');
      if (r.error === 'da_cai_roi') return veMatKhau('Bảng nhịp đã được cài đặt. Nhập mật khẩu.');
      S.pw = a; lsSet(LS.pw, a); moApp();
    }).catch(function () { veCaiDatDau('Chưa kết nối được máy chủ. Kiểm tra đường dẫn và quyền "Bất kỳ ai".'); });
  };
}
function veMatKhau(loi) {
  manTrung('<p class="tieu">✦ Để vinh danh Chúa hơn</p><h1>Bảng nhịp vận hành</h1><p class="meta">App riêng · cần mật khẩu.</p>' +
    '<input id="mk" type="password" autocomplete="current-password" placeholder="Mật khẩu" style="margin-top:14px">' +
    '<label class="meta" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="hien-mk"> Hiện mật khẩu</label>' +
    (loi ? '<p class="loi">' + esc(loi) + '</p>' : '') + '<button class="nut-chinh" id="nut-mk" style="margin-top:12px;justify-content:center">MỞ KHOÁ</button>' + DONG_MAY_KHAC);
  ganMayKhac();
  $('#hien-mk').onchange = function () { $('#mk').type = this.checked ? 'text' : 'password'; };
  $('#mk').onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) $('#nut-mk').click(); };
  $('#nut-mk').onclick = function () {
    var a = nz($('#mk').value); if (!a) return;
    this.disabled = true; S.pw = a;
    goi('load', { appUrl: location.origin + location.pathname }).then(function (r) {
      if (!r.ok) { S.pw = ''; return veMatKhau(r.error === 'unauthorized' ? 'Sai mật khẩu. Thử lại nhé.' : 'Chưa mở được (' + r.error + ').'); }
      lsSet(LS.pw, a); S.goc = { bang: r.bang, cfg: r.cfg, lichDaTao: r.lichDaTao, phienMay: r.phien }; lsSet(LS.goc, S.goc); moApp(true);
    }).catch(function () { S.pw = ''; veMatKhau('Chưa kết nối được máy chủ.'); });
  };
}
function moApp(daCoDuLieu) {
  veKhung(); S.tab = 'homnay'; S.lop = [];
  if (!$('#toast')) { var t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  if (daCoDuLieu || S.goc) { tinhLai(); ve(); }
  else $('#noi').innerHTML = '<p class="trong">Đang mở…</p>';
  (daCoDuLieu ? Promise.resolve() : taiLai()).then(function () {
    if (!S.data) { if (S.pw) $('#noi').innerHTML = '<div class="trung" style="min-height:60vh"><p class="meta">Chưa tải được dữ liệu.</p><button class="nut-phu" onclick="moApp()">Thử lại</button></div>'; return; }
    var m = /^#nhip\/(.+)$/.exec(location.hash); // mở từ lời nhắc trên lịch
    if (m && S.idx.viec[m[1]]) {
      var v = M2.phienBan(S.idx, m[1], S.hn) || M2.phienBanMoiNhat(S.idx, m[1]);
      S.tab = 'nhip'; ve(); moLop('the', { id: m[1], khoa: M2.khoaKy(v.nhip, S.hn) });
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
    }
    guiTiep();
  });
}
function batDauApp() {
  var q = new URLSearchParams(location.search);
  if (q.get('kiemtra')) { manTrung('<h1>Kiểm tra luật</h1>' + bangKiemTra()); return; }
  S.api = lsGet(LS.api, '') || API_URL;
  var may = layLinkExec(q.get('may') || ''); if (may && may !== S.api) datMayChu(may);
  if (q.has('may')) { q.delete('may'); try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); } catch (e) { } } // bỏ ?may= khỏi thanh địa chỉ để lần tải lại không ghi đè máy chủ đã chọn
  if (!S.api) return veKetNoi();
  S.pw = lsGet(LS.pw, ''); S.goc = lsGet(LS.goc, null); S.hangDoi = lsGet(LS.q, []);
  if (S.pw) return moApp();
  manTrung('<p class="meta">Đang kết nối máy chủ…</p>');
  goi('ping').then(function (r) { if (r.ok && r.daCaiDat === false) veCaiDatDau(); else veMatKhau(); })
    .catch(function () { veKetNoi('Chưa kết nối được máy chủ này. Kiểm tra lại đường dẫn /exec và quyền truy cập "Bất kỳ ai".'); });
}
batDauApp();

</script>
